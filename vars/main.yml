---
# vars file for duckdb
duckdb_os: '{{ duckdb_os_map[ansible_facts["system"]] }}'
duckdb_arch: '{{ duckdb_arch_map[ansible_facts["architecture"]] }}'
duckdb_platform: '{{ duckdb_os }}-{{ duckdb_arch }}'
duckdb_checksum: '{{ duckdb_checksums[duckdb_ver][duckdb_platform] }}'
# 2.0.0 renamed duckdb_cli-*.zip to duckdb-cli-*.tar.gz
duckdb_v2: '{{ duckdb_ver is version("2.0.0", ">=") }}'
duckdb_archive_sep: '{{ "-" if duckdb_v2 else "_" }}'
duckdb_archive_ext: '{{ "tar.gz" if duckdb_v2 else "zip" }}'
duckdb_url: '{{ duckdb_mirror }}/v{{ duckdb_ver }}/duckdb{{ duckdb_archive_sep }}cli-{{ duckdb_platform }}.{{ duckdb_archive_ext }}'
duckdb_name: duckdb_cli-{{ duckdb_ver }}-{{ duckdb_platform }}
duckdb_tmp_archive: '{{ duckdb_tmp_dir | default("/tmp") }}/{{ duckdb_name }}.{{ duckdb_archive_ext }}'
duckdb_install_dir: '{{ duckdb_parent_install_dir }}/{{ duckdb_name }}'
duckdb_install_exe: '{{ duckdb_install_dir }}/duckdb'
duckdb_link: '{{ duckdb_parent_install_dir }}/bin/duckdb'
